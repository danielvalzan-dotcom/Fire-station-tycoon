<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Firey Tycoon">
<meta name="theme-color" content="#b71c1c">
<meta name="format-detection" content="telephone=no">
<title>Firey Station Tycoon</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#2b1a14;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
body{position:fixed;inset:0;touch-action:manipulation}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#app{position:absolute;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:520px;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:#2b1a14}
/* HUD */
#hud{flex:0 0 auto;padding:8px 10px 6px;background:linear-gradient(#c62828,#9e1b1b);box-shadow:0 2px 0 #6d1010;z-index:2}
.r1{display:flex;align-items:center;gap:6px}
.coins{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
#coins{font-size:26px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 0 #6d1010}
#rate{font-size:12px;opacity:.85;font-weight:700;white-space:nowrap}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffc928 45%,#e09a00);
  box-shadow:inset 0 0 0 1.5px #b87900;vertical-align:-2px}
.coin.big{width:24px;height:24px;box-shadow:inset 0 0 0 2px #b87900,0 2px 0 #6d1010}
.pill{height:36px;border:none;border-radius:18px;padding:0 10px;background:#ffcc33;color:#5a3300;font-weight:900;font-size:14px;box-shadow:0 3px 0 #b8860b;white-space:nowrap}
.pill small{font-size:9px;font-weight:900;background:#5a3300;color:#ffcc33;border-radius:4px;padding:1px 3px;margin-left:2px;vertical-align:2px}
.pill.on{background:#7dff8a;color:#0b4a12;box-shadow:0 3px 0 #2e9d3a}
.ibtn{width:36px;height:36px;border:none;border-radius:12px;background:rgba(0,0,0,.25);color:#fff;font-size:18px;padding:0}
.r2{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:800}
#rank{white-space:nowrap}
.xpbar{flex:1;height:9px;border-radius:5px;background:rgba(0,0,0,.3);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd54f,#ff9800);border-radius:5px;transition:width .3s}
#crewInfo{white-space:nowrap;opacity:.95}
/* Map */
#mapWrap{flex:1 1 auto;position:relative;min-height:0;background:#6fb46a;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toasts{position:absolute;left:0;right:0;top:48px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:3}
.toast{background:rgba(30,20,15,.88);color:#fff;font-weight:800;font-size:14px;padding:8px 14px;border-radius:14px;max-width:88%;text-align:center;
  animation:tin .25s ease-out;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.toast.good{background:rgba(27,110,45,.92)}.toast.bad{background:rgba(160,30,30,.92)}.toast.gold{background:rgba(200,140,0,.95)}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:none}}
/* Panel */
#panel{flex:0 0 38%;display:flex;flex-direction:column;background:#fff6ea;color:#3a2618;border-radius:18px 18px 0 0;margin-top:-14px;z-index:2;
  box-shadow:0 -3px 12px rgba(0,0,0,.25);min-height:0}
#tabs{display:flex;padding:8px 8px 0;gap:6px}
.tab{flex:1;height:40px;border:none;border-radius:12px 12px 0 0;background:#f0dcc4;color:#7a5638;font-weight:900;font-size:14px;position:relative}
.tab.on{background:#ffe2bd;color:#b71c1c}
.tab .dot{position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:#e53935;display:none}
.tab.has .dot{display:block}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;background:#ffe2bd;margin:0 8px;border-radius:0 0 12px 12px;padding:4px 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:4px 6px;background:#fff6ea;border-radius:14px;box-shadow:0 2px 0 #e8c9a2}
.ico{flex:0 0 46px;width:46px;height:46px;border-radius:12px;background:#ffd6a8;display:grid;place-items:center;font-size:25px}
.info{flex:1;min-width:0}
.nm{font-weight:900;font-size:15px;line-height:1.15}
.nm .lv{font-size:11px;color:#b71c1c;background:#ffe0e0;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.ds{font-size:12px;color:#7a5638;line-height:1.25;margin-top:2px}
.tag{display:inline-block;font-size:10px;font-weight:900;background:#e53935;color:#fff;border-radius:6px;padding:1px 5px;margin-top:3px}
.buy{flex:0 0 auto;min-width:86px;height:46px;border:none;border-radius:12px;background:#2e9d4f;color:#fff;font-weight:900;font-size:15px;
  box-shadow:0 3px 0 #1d6b35;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px}
.buy.cant{background:#c9b9a6;box-shadow:0 3px 0 #9d8b77}
.buy.max{background:#8d6e63;box-shadow:0 3px 0 #5d4037;font-size:13px}
.buy.demo{background:#5c6bc0;box-shadow:0 3px 0 #3949ab;font-size:12px;line-height:1.1;flex-direction:column;gap:0}
.buy.demo small{font-size:9px;opacity:.9;font-weight:800}
.buy.alt{background:#ff9800;box-shadow:0 3px 0 #c66900}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.banner{margin:6px 6px 4px;padding:8px 10px;border-radius:12px;background:#3949ab;color:#fff;font-size:12px;font-weight:800;text-align:center}
.sect{font-size:12px;font-weight:900;color:#9a6a44;margin:10px 14px 2px;text-transform:uppercase;letter-spacing:.6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:2px;border:1px solid rgba(0,0,0,.2)}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(20,10,5,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#modal.on{display:flex}
.card{width:100%;max-width:360px;background:#fff6ea;color:#3a2618;border-radius:22px;padding:20px 18px 18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s}
.card h2{margin:0 0 6px;font-size:22px;color:#b71c1c}
.card p{margin:6px 0;font-size:14px;line-height:1.4}
.card .big{font-size:30px;font-weight:900;color:#2e7d32;margin:8px 0}
.card .btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.card .btns .buy{width:100%;height:50px;font-size:16px}
.logo{font-size:34px;font-weight:900;line-height:1;color:#c62828;text-shadow:0 3px 0 #ffcc33;letter-spacing:-.5px;margin:4px 0 2px}
.logo span{display:block;font-size:22px;color:#e65100;text-shadow:0 2px 0 #ffe0a0}
.fine{font-size:11px !important;color:#9a7a5e}
.adbox{background:#222;color:#fff;border-radius:16px;padding:22px 12px;margin:8px 0}
.adbox .demo{display:inline-block;background:#ffcc33;color:#000;font-weight:900;border-radius:6px;padding:2px 8px;font-size:13px}
.adbox .cd{font-size:56px;font-weight:900;margin:8px 0}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:4px 2px;border-bottom:1px dashed #e0c4a0}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="r1">
      <div class="coins"><span class="coin big"></span><span id="coins">0</span><span id="rate">+0/s</span></div>
      <button id="boostBtn" class="pill" aria-label="Watch demo ad for double coins">📺 2x<small>DEMO</small></button>
      <button id="sndBtn" class="ibtn" aria-label="Sound">🔇</button>
      <button id="menuBtn" class="ibtn" aria-label="Menu">⚙️</button>
    </div>
    <div class="r2"><span id="rank">Lv 1 · Probie</span><div class="xpbar"><i id="xpfill"></i></div><span id="crewInfo"></span></div>
  </div>
  <div id="mapWrap"><canvas id="map"></canvas><div id="toasts"></div></div>
  <div id="panel">
    <div id="tabs">
      <button class="tab on" data-tab="up">🔧 Upgrades<span class="dot"></span></button>
      <button class="tab" data-tab="st">🏠 Stations<span class="dot"></span></button>
      <button class="tab" data-tab="shop">🛒 Shop</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<div id="modal"><div class="card" id="card"></div></div>

<script>
'use strict';
(() => {
/* =========================================================
   Firey Station Tycoon — prototype v0.1
   Original art drawn in code. Not affiliated with any fire service.
   Sections: CONFIG · STATE/SAVE · ECONOMY · WORLD · ENTITIES ·
             AUDIO · RENDER · INPUT · UI · LOOP
   ========================================================= */

/* ---------- CONFIG ---------- */
const GRID = 40;                    // road spacing (world units)
const W = 200, H = 960;             // world size: 6 suburbs of 200 x 160 stacked vertically
const ROAD_W = 9;
const SAVE_KEY = 'fireyStationTycoon_v1';
const OFFLINE_CAP_S = 2 * 3600;
const BOOST_S = 120;

const DISTRICTS = [
  { name:'Snag Flats',      c:0, r:0, mult:1,   cost:0,     style:'burbs' },
  { name:'Thong Valley',    c:0, r:1, mult:1.7, cost:300,   style:'burbs' },
  { name:'Magpie Creek',    c:0, r:2, mult:2.8, cost:1500,  style:'bush'  },
  { name:'Pavlova Heights', c:0, r:3, mult:4.5, cost:6000,  style:'town'  },
  { name:'Drop Bear Downs', c:0, r:4, mult:7,   cost:20000, style:'bush'  },
  { name:'Cockatoo Cove',   c:0, r:5, mult:11,  cost:60000, style:'city'  },
];

const CALLS = [
  { id:'bbq',   name:'Snag BBQ flare-up',   reward:6,   work:2.5, xp:1,  ladder:0, minD:0, w:5,   kind:'fire',  size:.55 },
  { id:'bin',   name:'Wheelie bin fire',    reward:8,   work:3,   xp:2,  ladder:0, minD:0, w:5,   kind:'fire',  size:.7 },
  { id:'car',   name:'Car fire',            reward:14,  work:4,   xp:3,  ladder:0, minD:0, w:4,   kind:'car',   size:.85 },
  { id:'grass', name:'Grass fire',          reward:22,  work:6,   xp:4,  ladder:0, minD:0, w:3,   kind:'grass', size:1 },
  { id:'cat',   name:'Cat up a tree',       reward:28,  work:4,   xp:5,  ladder:1, minD:0, w:3,   kind:'cat' },
  { id:'house', name:'House fire',          reward:40,  work:8,   xp:7,  ladder:0, minD:0, w:1.5, kind:'house', size:1.2 },
  { id:'balc',  name:'Balcony rescue',      reward:70,  work:7,   xp:10, ladder:2, minD:1, w:2,   kind:'rescue' },
  { id:'shed',  name:'Shed full of fireworks', reward:90, work:9, xp:12, ladder:0, minD:2, w:2,   kind:'fire',  size:1.45 },
  { id:'tower', name:'High-rise blaze',     reward:180, work:12,  xp:20, ladder:3, minD:3, w:2,   kind:'tower', size:1.6 },
];

const UP = {
  speed:   { icon:'🚒', name:'Bigger engine', base:25, g:1.55, max:12,
             desc:l=>`Trucks drive faster: +${20*l}% → +${20*(l+1)}%` },
  hose:    { icon:'💦', name:'Hose power', base:40, g:1.6, max:12,
             desc:l=>`Jobs finish quicker: −${pct(1-Math.pow(.88,l))}% → −${pct(1-Math.pow(.88,l+1))}%` },
  truck:   { icon:'🚚', name:'Buy a truck', base:80, g:1.85, maxFn:()=>2*S.stations,
             desc:()=>`${trucks.length} truck${trucks.length>1?'s':''}. Each job needs a free truck.` },
  crew:    { icon:'🧑‍🚒', name:'Hire a crew', base:60, g:2.1, max:10,
             desc:()=>`${crews()} crew${crews()>1?'s':''} on shift. Each crew runs one job at a time.` },
  ladder:  { icon:'🪜', name:'Ladder', costs:[150,800,3500], max:3,
             desc:l=>['Unlocks 🐈 cat-up-a-tree jobs','Unlocks 🧍 balcony rescues','Unlocks 🏢 high-rise blazes'][l] || 'Tallest ladder in town' },
  payout:  { icon:'🌭', name:'Sausage sizzle fundraiser', base:100, g:1.9, max:20,
             desc:l=>`All payouts +${15*l}% → +${15*(l+1)}%` },
  dispatch:{ icon:'📻', name:'Dispatcher', costs:[400,1500,5000], max:3,
             desc:l=>['Auto-sends trucks to calls (slowly) + better idle pay','Faster auto-dispatch','Lightning auto-dispatch'][l] || 'Best dispatcher in the state' },
};
const UP_ORDER = ['speed','hose','truck','crew','ladder','payout','dispatch'];
const AUTO_DELAY = [Infinity, 4, 2, 0.7];

const RANKS = [[1,'Probie'],[3,'Hose Dragger'],[5,'Smoke Eater'],[8,'Ladder Legend'],[12,'Snag Sergeant'],[16,'Big Boss Firey'],[20,'Living Legend']];

const SKINS = {
  classic:{ name:'Classic Red',     body:'#d32f2f', cab:'#b71c1c', stripe:'#fff' },
  ochre:  { name:'Outback Ochre',   body:'#d9822b', cab:'#a85b14', stripe:'#fff3d6' },
  chrome: { name:'Midnight Chrome', body:'#37474f', cab:'#263238', stripe:'#ffd54f' },
  lime:   { name:'Lime Rescue',     body:'#c6e03a', cab:'#8fa81c', stripe:'#1b5e20' },
};
const SHOP = [
  { id:'noads',   icon:'🚫', name:'Remove ads',  price:'A$4.99', desc:'No more ads, ever. Keeps the 2x boost button.' },
  { id:'starter', icon:'🎁', name:'Starter pack', price:'A$2.99', desc:'5,000 coins + a free truck to get rolling.' },
  { id:'ochre',   icon:'🎨', name:'Outback Ochre skin',   price:'A$1.99', skin:'ochre' },
  { id:'chrome',  icon:'🎨', name:'Midnight Chrome skin', price:'A$1.99', skin:'chrome' },
  { id:'lime',    icon:'🎨', name:'Lime Rescue skin',     price:'A$1.99', skin:'lime' },
  { id:'xmas',    icon:'🎄', name:'Christmas station',    price:'A$2.99', desc:'Tinsel, lights and a Santa hat on every station.' },
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const pct = v => Math.round(v*100);
const rand = (a,b) => a + Math.random()*(b-a);
function fmt(n){ n=Math.floor(n); if(n<1000) return String(n);
  const u=['k','M','B','T','Qa']; let i=-1; let x=n; while(x>=1000&&i<u.length-1){x/=1000;i++;}
  return (x<10?x.toFixed(2):x<100?x.toFixed(1):Math.floor(x))+u[i]; }
function fmtTime(s){ s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  return h?`${h}h ${m}m`:m?`${m}m ${s%60}s`:`${s}s`; }
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- STATE / SAVE ---------- */
function defaultState(){ return { v:1, coins:20, xp:0, level:1,
  up:{speed:0,hose:0,truck:0,crew:0,ladder:0,payout:0,dispatch:0},
  stations:1, truckHomes:[0], skin:'classic', xmas:false, muted:true,
  rate:0, lastSeen:Date.now(), boostUntil:0, stats:{calls:0,earned:0,missed:0}, tut:0, started:false }; }
let S = defaultState();
function load(){
  try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const d=JSON.parse(raw); const def=defaultState();
    S=Object.assign(def,d); S.up=Object.assign(def.up,d.up||{}); S.stats=Object.assign(defaultState().stats,d.stats||{});
    if(!Array.isArray(S.truckHomes)||!S.truckHomes.length) S.truckHomes=[0];
    return true; }catch(e){ return false; }
}
function save(){ S.lastSeen=Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- ECONOMY ---------- */
const crews = () => 1 + S.up.crew + (S.stations-1);
const speed = () => 55 * (1 + 0.2*S.up.speed);
const workMult = () => Math.pow(0.88, S.up.hose);
const boostActive = () => Date.now() < S.boostUntil;
const levelMult = () => 1 + 0.05*(S.level-1);
const basePayMult = () => (1 + 0.15*S.up.payout) * levelMult();
const xpNeed = L => Math.round(8*Math.pow(1.45, L-1));
const rankName = () => { let n=RANKS[0][1]; for(const [l,r] of RANKS) if(S.level>=l) n=r; return n; };
function upMax(id){ const u=UP[id]; return u.maxFn?u.maxFn():u.max; }
function upCost(id){ const u=UP[id], l=S.up[id]; if(l>=upMax(id)) return null;
  return u.costs ? u.costs[l] : Math.round(u.base*Math.pow(u.g,l)); }
let secIncome = 0;
function addCoins(n, raw){ S.coins+=n; S.stats.earned+=n; secIncome += raw ?? n; }
function addXP(n){ S.xp+=n; let lv=false;
  while(S.xp>=xpNeed(S.level)){ S.xp-=xpNeed(S.level); S.level++; lv=true; }
  if(lv){ toast(`⭐ Promoted! Lv ${S.level} · ${rankName()} (+5% pay)`,'gold'); Snd.level(); confetti(); }
}
function buyUpgrade(id){
  const c=upCost(id); if(c==null) return; if(S.coins<c){ toast('Not enough coins yet, mate','bad'); Snd.no(); return; }
  S.coins-=c; S.up[id]++;
  if(id==='truck'){ const home=leastTrucksStation(); S.truckHomes.push(home); trucks.push(makeTruck(home)); }
  if(id==='ladder') toast(['🪜 Ladder fitted! Cats beware.','🪜 Longer ladder: balcony rescues unlocked!','🪜 Sky ladder: high-rise blazes unlocked!'][S.up.ladder-1],'good');
  if(id==='dispatch' && S.up.dispatch===1) toast('📻 Dispatcher hired — trucks will head out on their own','good');
  Snd.buy(); afterChange();
}
function buyStation(i){
  if(i!==S.stations) return; const c=DISTRICTS[i].cost;
  if(S.coins<c){ toast('Not enough coins yet','bad'); Snd.no(); return; }
  S.coins-=c; S.stations++; S.truckHomes.push(i); trucks.push(makeTruck(i));
  toast(`🏠 New station in ${DISTRICTS[i].name}! +1 truck, +1 crew`,'good'); Snd.level(); confetti();
  buildMap(); afterChange(); focusY(stationPos(i).y);
}
function leastTrucksStation(){ const cnt=Array(S.stations).fill(0); S.truckHomes.forEach(h=>cnt[h]++);
  let best=S.stations-1; for(let i=S.stations-1;i>=0;i--) if(cnt[i]<cnt[best]) best=i; return best; }

/* ---------- WORLD ---------- */
function stationPos(i){ const d=DISTRICTS[i]; return { x:d.c*200+120, y:d.r*160+80 }; }
function districtAt(x,y){ return clamp(Math.floor(y/160),0,DISTRICTS.length-1); }
function districtInts(i){ const d=DISTRICTS[i], out=[];
  for(const dx of [40,80,120,160]) for(const dy of [40,80,120]) out.push({x:d.c*200+dx, y:d.r*160+dy}); return out; }
function isStationBlock(bx,by){ // block centre
  for(let i=0;i<DISTRICTS.length;i++){ const p=stationPos(i); if(Math.abs(bx-(p.x-20))<1&&Math.abs(by-(p.y-20))<1) return true; } return false; }

/* ---------- ENTITIES ---------- */
let trucks=[], calls=[], parts=[], floaters=[];
let callId=0, spawnT=1.5, autoT=0, time=0;
function makeTruck(home){ const p=stationPos(home); return { home, x:p.x, y:p.y, ang:Math.PI/2, state:'idle', path:[], call:null, work:0, workTime:1 }; }
function resetTrucks(){ trucks=S.truckHomes.filter(h=>h<S.stations).map(makeTruck); }
const busyCrews = () => trucks.filter(t=>t.state==='toCall'||t.state==='working').length;

function spawnCall(forceD, forceType){
  const waiting=calls.filter(c=>c.state==='waiting').length;
  if(waiting >= 2+2*S.stations) return;
  const d = forceD ?? Math.floor(Math.random()*S.stations);
  const st=stationPos(d);
  const free=districtInts(d).filter(p=>!(p.x===st.x&&p.y===st.y) && !calls.some(c=>c.ix===p.x&&c.iy===p.y));
  if(!free.length) return;
  const p=free[Math.floor(Math.random()*free.length)];
  let type=forceType;
  if(!type){ const pool=CALLS.filter(t=>d>=t.minD); let tot=0;
    const ws=pool.map(t=>{ const w=t.w*(t.ladder>S.up.ladder?0.35:1)*(t.minD>0&&d>=t.minD?1.6:1); tot+=w; return w; });
    let r=Math.random()*tot; type=pool[pool.length-1]; for(let i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0){ type=pool[i]; break; } } }
  // incident sits on a block corner next to the intersection (not on a station)
  let corners=[[1,1],[-1,1],[1,-1],[-1,-1]].sort(()=>Math.random()-.5);
  if(p.y<=40) corners=corners.filter(([,sy])=>sy>0); // keep marker bubbles below the top edge

function canDo(c){ return c.type.ladder<=S.up.ladder; }
function dispatch(call, auto){

  if(!paused) update(dt);

  else if(Math.abs(camVel)>1&&!drag){ setCam(camY+camVel*dt); camVel*=Math.pow(0.93,dt*60); }
  acc1+=dt; acc4+=dt; accSave+=dt;
  if(acc1>=1){ S.rate=S.rate*0.97+(secIncome/acc1)*0.03; secIncome=0; acc1=0; }
  if(acc4>=0.25){ acc4=0; updateHUD(); refreshPanel(); }
  if(accSave>=5){ accSave=0; save(); }
  render(); requestAnimationFrame(frame);
}
